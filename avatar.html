<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avatar Maker | MANUSHRI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a href="index.html" class="logo">MANUSHRI<span>.</span></a>
    <button class="burger" id="burger" aria-label="Toggle menu" aria-expanded="false">
      <i></i><i></i><i></i>
    </button>
    <nav class="links" id="links">
      <a href="index.html#home">Home</a>
      <a href="index.html#skills">Skills</a>
      <a href="index.html#work">Work</a>
      <a href="index.html#contact">Contact</a>
      <a href="avatar.html" class="btn-mini active">Avatar</a>
    </nav>
  </header>

  <main class="maker">
    <h1 class="title">Avatar <em>maker.</em></h1>
    <p class="sub">Pick your look. It saves automatically and shows up on the home screen.</p>

    <div class="maker-grid">
      <div class="preview px">
        <div class="status"><span>&hearts; 9999</span><span id="pvLv">LV.25</span></div>
        <canvas id="builderCanvas" aria-label="Avatar preview"></canvas>
        <div class="dialog px-sm"><p id="pvName">PLAYER ONE</p></div>
        <div class="row center">
          <button class="btn" id="btnRandom" type="button">Random</button>
          <button class="btn mint" id="btnDownload" type="button">Download</button>
          <button class="btn ghost" id="btnReset" type="button">Reset</button>
        </div>
      </div>

      <div class="controls px" id="controls">
        <label class="field">Name
          <input id="inName" maxlength="14" value="PLAYER ONE" />
        </label>
        <label class="field">Tagline
          <input id="inTag" maxlength="34" value="Glam. Bold. Unbothered." />
        </label>
        <!-- option groups are generated by js/avatar.js -->
      </div>
    </div>
  </main>

  <footer class="foot-bar">
    <span>&copy; 2026 MANUSHRI. All rights reserved.</span>
    <a href="index.html#home">Back to home</a>
  </footer>

  <script src="js/avatar.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
